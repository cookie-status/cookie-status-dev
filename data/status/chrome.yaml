# See brave.yaml for the format.
classification-of-known-trackers:
  claims:
    - text: "n/a"

tracker-blocking:
  status: none
  checked: 2026-10-31
  claims:
    - text: "Requests to known trackers are not blocked."
      new: true

third-party-cookies:
  status: none
  checked: 2026-10-31
  sources:
    - title: Cookie Status test, 2026-10-31
    - title: Next steps for Privacy Sandbox and tracking protections in Chrome (April 2025)
      url: https://privacysandbox.google.com/blog/privacy-sandbox-next-steps
    - title: Update on plans for Privacy Sandbox technologies (October 2025)
      url: https://privacysandbox.google.com/blog/update-on-plans-for-privacy-sandbox-technologies
    - title: Storage Access API (MDN)
      url: https://developer.mozilla.org/en-US/docs/Web/API/Storage_Access_API
  claims:
    - text: "Third-party cookies are allowed. Google has dropped its plan to restrict them by default, and retired most other Privacy Sandbox technologies in October 2025."
      new: true
    - text: "Opt-in mechanism (CHIPS) for partitioning cookies in 3P context."
    - text: "Supports the Storage Access API, which matters mostly where third-party cookies are blocked."
      appliesTo: Chrome 119+
      new: true
    - text: "Cookies restricted to a maximum lifetime of 400 days."

first-party-cookies:
  status: limited
  checked: 2026-10-31
  sources:
    - title: Cookie Status test, 2026-10-31
  claims:
    - text: "Cookies restricted to a maximum lifetime of 400 days."

other-third-party-storage:
  status: partitioned
  checked: 2026-10-31
  sources:
    - title: privacytests.org (2026-10-22)
      url: https://privacytests.org/
    - title: Gaining security and privacy by partitioning the cache (Chrome for Developers)
      url: https://developer.chrome.com/blog/http-cache-partitioning
  claims:
    - text: "Chrome partitions third-party storage."
    - text: "The HTTP cache is partitioned by top-level site, so cached files can't be used to track across sites."
      appliesTo: Chrome 86+
      new: true

other-first-party-storage:
  status: none
  claims:
    - text: "No restrictions."

cname-cloaking:
  status: none
  claims:
    - text: "No restrictions."

fingerprinting:
  checked: 2026-10-31
  sources:
    - title: Cookie Status test, 2026-10-31
    - title: User-Agent Reduction (Chromium)
      url: https://www.chromium.org/updates/ua-reduction/
  claims:
    - text: "The User-Agent string is reduced: the minor version, platform version and device model are frozen. Sites can ask for the details through User-Agent Client Hints."
      new: true
    - text: "Freezes the macOS version to `10_15_7` in the User-Agent string."

referrer:
  checked: 2026-10-31
  sources:
    - title: Cookie Status test, 2026-10-31
  claims:
    - text: "Default browser policy (`strict-origin-when-cross-origin`)"
    - text: "Sites can loosen the policy: with `unsafe-url`, the full URL is sent to other sites."
      new: true

other:
  claims:
    - text: "n/a"
